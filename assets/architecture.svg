<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="760" height="460" fill="#0b1120"/>

  <!-- Layer 1: JS SDK -->
  <rect x="150" y="28" width="460" height="64" rx="8" fill="#111c33" stroke="#1e3a5f"/>
  <text x="380" y="56" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="600">小程序 JS 层</text>
  <text x="380" y="76" text-anchor="middle" fill="#94a3b8" font-size="12">wx.js 桥接 SDK　·　ktml.js 模板编译器</text>

  <!-- arrow -->
  <line x1="380" y1="92" x2="380" y2="120" stroke="#334155" stroke-width="2"/>
  <path d="M374 114 L380 122 L386 114" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="392" y="110" fill="#64748b" font-size="11">postMessage</text>

  <!-- Layer 2: Bridge -->
  <rect x="150" y="122" width="460" height="64" rx="8" fill="#111c33" stroke="#1e3a5f"/>
  <text x="380" y="150" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="600">WKWebView 桥接层</text>
  <text x="380" y="170" text-anchor="middle" fill="#94a3b8" font-size="12">BridgeMessageHandler　·　router / store / auth 原生直通</text>

  <line x1="380" y1="186" x2="380" y2="214" stroke="#334155" stroke-width="2"/>
  <path d="M374 208 L380 216 L386 208" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Layer 3: Gateway -->
  <rect x="150" y="216" width="460" height="96" rx="8" fill="#0f2136" stroke="#0ea5e9"/>
  <text x="380" y="242" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="600">能力网关 CapabilityGateway（每会话独立实例）</text>
  <text x="380" y="266" text-anchor="middle" fill="#cbd5e1" font-size="12">manifest 声明校验　·　L0~L2 级别检查　·　地区可用性　·　系统权限</text>
  <text x="380" y="288" text-anchor="middle" fill="#cbd5e1" font-size="12">ObjC 异常隔离　·　审计日志　·　统一错误封装</text>

  <line x1="380" y1="312" x2="380" y2="340" stroke="#334155" stroke-width="2"/>
  <path d="M374 334 L380 342 L386 334" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Layer 4: Providers -->
  <rect x="90" y="342" width="580" height="90" rx="8" fill="#111c33" stroke="#1e3a5f"/>
  <text x="380" y="368" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="600">45 个原生 Provider（每会话全新实例）</text>
  <g fill="#0b1120" stroke="#334155">
    <rect x="116" y="382" width="88" height="30" rx="6"/>
    <rect x="216" y="382" width="88" height="30" rx="6"/>
    <rect x="316" y="382" width="88" height="30" rx="6"/>
    <rect x="416" y="382" width="88" height="30" rx="6"/>
    <rect x="516" y="382" width="128" height="30" rx="6"/>
  </g>
  <g fill="#94a3b8" font-size="12" text-anchor="middle">
    <text x="160" y="401">AVFoundation</text>
    <text x="260" y="401">CoreLocation</text>
    <text x="360" y="401">EventKit</text>
    <text x="460" y="401">Photos</text>
    <text x="580" y="401">HealthKit 等</text>
  </g>
</svg>
